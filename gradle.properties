kotlin.code.style=official
kotlin.mpp.stability.nowarn=true

ktCompilerArgs=-opt-in=kotlin.RequiresOptIn;-Xexpect-actual-classes;-opt-in=kotlin.js.ExperimentalJsExport;-opt-in=it.unibo.tuprolog.argumentation.InternalArg2pApi
ktCompilerArgsJs=-Xes-long-as-bigint
# a single ES module for each package of JavaScript, exporting all of its API
kotlin.js.ir.output.granularity=whole-program
ktCompilerArgsJvm=-Xjvm-default=all;-Xjdk-release=21
allWarningsAsErrors=false
useKotlinBom=false
ktTargetJsDisable=false
ktTargetJvmDisable=false
disableJavadocTask=true
versionsFromCatalog=
docStyle=html

# mocha timeout for a single test method, in milliseconds
mochaTimeout=1800000
nodeVersion=

org.gradle.console=plain
# the outputs of the tasks reused from the build cache (on CI, the one the cache of the workflows keeps), and the
# projects built in parallel
org.gradle.caching=true
org.gradle.parallel=true
systemProp.org.gradle.internal.http.connectionTimeout=180000
systemProp.org.gradle.internal.http.socketTimeout=180000
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=2g

jvmStackSize=512M
jvmMaxHeapSize=2G

mavenCentralUsername=
mavenCentralPassword=
repoOwner=tuProlog
otherRepo=
signingKey=
signingPassword=

npmToken=
npmOrganization=tuprolog
npmRepo=https://registry.npmjs.org
npmDryRun=false

