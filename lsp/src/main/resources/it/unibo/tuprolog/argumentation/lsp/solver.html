<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="color-scheme" content="light dark" />
        <title>Arg2P</title>
        <style>
{{style}}
        </style>
    </head>
    <body>
        <arg2p-solver theory-tab>
            <p class="loading">Loading the solver of Arg2P…</p>
            <button type="button" slot="actions" id="playground" title="Open this theory in the web playground" hidden>Playground ↗</button>
            <button type="button" slot="actions" id="fullscreen" hidden>Full screen</button>
        </arg2p-solver>
        <script type="module">
            // The solver of a theory, in the conversation with an AI assistant: an MCP App of the MCP server of Arg2P.
            // <arg2p-solver> of @tuprolog/arg2p-ui, the theory edited in a tab of its own, on an engine that is the
            // server: the page speaks to it as the solver of the browser does to its worker, each message through the
            // tool engine of the server.
            //
            // Each module is bundled with its dependencies by the CDN (?bundle): the editors need a single copy of
            // CodeMirror, which modules resolved one by one do not give.
            import '{{cdn}}/@tuprolog/arg2p-ui@{{ui}}/solver?bundle';
            import { JsEngine } from '{{cdn}}/@tuprolog/arg2p-ui@{{ui}}/js?bundle';

            const solver = document.querySelector('arg2p-solver');
            const playground = document.getElementById('playground');
            const fullscreen = document.getElementById('fullscreen');

            // --- the host: JSON-RPC over postMessage (MCP Apps) ---------------------------------------------------

            const pending = new Map();
            let sequence = 0;
            const send = message => window.parent.postMessage({ jsonrpc: '2.0', ...message }, '*');
            const request = (method, params) =>
                new Promise((resolve, reject) => {
                    const id = ++sequence;
                    pending.set(id, { resolve, reject });
                    send({ id, method, params });
                });
            const notify = (method, params) => send(params === undefined ? { method } : { method, params });

            let context = {};

            window.addEventListener('message', event => {
                if (event.source !== window.parent) return;
                const message = event.data;
                if (message === null || typeof message !== 'object' || message.jsonrpc !== '2.0') return;
                if (message.method === undefined) {
                    const waiting = pending.get(message.id);
                    if (waiting === undefined) return;
                    pending.delete(message.id);
                    if (message.error) waiting.reject(new Error(message.error.message));
                    else waiting.resolve(message.result);
                    return;
                }
                switch (message.method) {
                    case 'ui/notifications/tool-input':
                        open(message.params?.arguments ?? {});
                        break;
                    case 'ui/notifications/tool-result':
                        opened(message.params?.structuredContent ?? null);
                        break;
                    case 'ui/notifications/host-context-changed':
                        applyContext(message.params);
                        break;
                    case 'ui/resource-teardown':
                        close();
                        send({ id: message.id, result: {} });
                        break;
                    case 'ping':
                        send({ id: message.id, result: {} });
                        break;
                    default:
                        if (message.id !== undefined) send({ id: message.id, error: { code: -32601, message: `Method not found: ${message.method}` } });
                }
            });

            // The theme of the host: light or dark, and its colours and fonts where it gives them; and its display modes
            function applyContext(changed = {}) {
                context = { ...context, ...changed };
                if (context.theme) document.documentElement.dataset.theme = context.theme;
                Object.entries(context.styles?.variables ?? {}).forEach(([name, value]) => {
                    if (value) document.documentElement.style.setProperty(name, value);
                });
                solver.restyle();
                fullscreen.hidden = !(context.availableDisplayModes ?? []).includes('fullscreen');
                display(context.displayMode);
            }

            // --- the engine: the tool engine of the server --------------------------------------------------------

            const session = crypto.randomUUID();
            // how long each request waits, in seconds: the timeoutSeconds explore was given (the server's default before)
            let timeoutSeconds;
            // the query solved when none is given, and the graph of none, as the server has them
            const DEFAULT_QUERY = {{query}};
            const EMPTY_GRAPH = {{emptyGraph}};

            // What a request is answered with when the server could not answer it
            function unanswered(message, text) {
                const error = { name: 'Error', message: text, syntax: null };
                switch (message.type) {
                    case 'solve':
                    case 'next':
                        return [{ type: 'failed', id: message.id, error }];
                    case 'graphAt':
                        return [{ type: 'graph', reqId: message.reqId, graph: EMPTY_GRAPH }];
                    case 'check':
                        return [{ type: 'checked', reqId: message.reqId, problem: null }];
                    case 'settings':
                        return [{ type: 'settings', reqId: message.reqId, settings: {} }];
                    default:
                        return [];
                }
            }

            function call(message) {
                const limit = timeoutSeconds === undefined ? {} : { timeoutSeconds };
                return request('tools/call', { name: 'engine', arguments: { session, request: message, ...limit } }).then(
                    result => (result?.isError ? unanswered(message, result.content?.[0]?.text ?? 'The engine failed.') : (result?.structuredContent?.answers ?? [])),
                    error => unanswered(message, error.message ?? String(error)),
                );
            }

            function close() {
                call({ type: 'close' }).catch(() => {});
            }

            const engine = new JsEngine(() => {
                const opened = {
                    onmessage: null,
                    postMessage: message => call(message).then(answers => answers.forEach(answer => opened.onmessage?.({ data: answer }))),
                    // the page forgotten by the server, the resolution under way stops there
                    terminate: close,
                };
                return opened;
            });

            // --- the solver ---------------------------------------------------------------------------------------

            solver.engine = engine;
            solver.query = DEFAULT_QUERY;
            // the theory, query and flags as the assistant gave them: told the assistant once changed
            let given = null;

            /** The theory the assistant explores, shown until the server tells how it is solved */
            function open(input) {
                solver.theory = input.theory ?? '';
                if (input.query) solver.query = input.query;
                if (input.flags) solver.flags = input.flags;
                solver.clear();
            }

            /**
             * What the server tells of it, solved at once: the theory, the query and the flags it is solved with (the
             * defaults of the server for those the assistant left out), how long it waits, and its link to the playground
             */
            function opened(result) {
                if (result === null) return;
                timeoutSeconds = result.timeoutSeconds ?? timeoutSeconds;
                solver.theory = result.theory ?? solver.theory;
                solver.query = result.query ?? solver.query;
                solver.flags = result.flags ?? solver.flags;
                given = { theory: solver.theory, query: solver.query, flags: solver.flags };
                playground.hidden = !result.playground;
                playground.onclick = () => request('ui/open-link', { url: result.playground }).catch(() => window.open(result.playground, '_blank', 'noopener'));
                solver.clear();
                solver.run();
            }

            // The assistant knows what the user solves here, once it is not what it gave
            solver.addEventListener('arg2p-run', ({ detail: { theory, query, flags } }) => {
                if (given === null || (given.theory === theory && given.query === query && given.flags === flags)) return;
                const text =
                    `In the solver of Arg2P, the user solved the query ${query} on this theory:\n\n${theory}\n\n` +
                    `with the flags:\n\n${flags || '(the defaults)'}`;
                request('ui/update-model-context', { content: [{ type: 'text', text }] }).catch(() => {});
            });

            // The page inline, or the whole screen: the graph fitted to the room it has then
            function display(mode) {
                const full = mode === 'fullscreen';
                document.documentElement.dataset.displayMode = full ? 'fullscreen' : 'inline';
                fullscreen.textContent = full ? 'Exit full screen' : 'Full screen';
                requestAnimationFrame(() => solver.fit());
            }

            fullscreen.addEventListener('click', () => {
                const mode = document.documentElement.dataset.displayMode === 'fullscreen' ? 'inline' : 'fullscreen';
                request('ui/request-display-mode', { mode })
                    .then(result => display(result?.mode))
                    .catch(() => {});
            });

            // --- the handshake: the solver tells the host its size as it changes ------------------------------------

            const initialized = await request('ui/initialize', {
                protocolVersion: '2026-01-26',
                appInfo: { name: 'arg2p-solver', version: '{{ui}}' },
                appCapabilities: { availableDisplayModes: ['inline', 'fullscreen'] },
            }).catch(() => null);
            applyContext(initialized?.hostContext ?? {});
            notify('ui/notifications/initialized');

            let size = { width: 0, height: 0 };
            const measure = () =>
                requestAnimationFrame(() => {
                    const height = Math.ceil(document.documentElement.getBoundingClientRect().height);
                    const width = Math.ceil(window.innerWidth);
                    if (width === size.width && height === size.height) return;
                    size = { width, height };
                    notify('ui/notifications/size-changed', size);
                });
            measure();
            new ResizeObserver(measure).observe(document.body);
            engine.start();
        </script>
    </body>
</html>
