<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="color-scheme" content="light dark" />
        <title>Join Arg2P</title>
        <style>
            /* The page a phone joins the federation of an editor from (see Federation of the language server) */
            :root {
                --surface: #ffffff;
                --text: #212529;
                --muted: #6c727a;
                --border: #dedfe2;
                --accent: #008080;
                --error: #b00020;
                font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            }
            @media (prefers-color-scheme: dark) {
                :root {
                    --surface: #1f2125;
                    --text: #e3e5e8;
                    --muted: #9aa0a8;
                    --border: #383c43;
                    --accent: #3fb0ac;
                    --error: #ff6b81;
                }
            }
            body {
                margin: 0;
                padding: 24px 16px;
                background: var(--surface);
                color: var(--text);
            }
            main {
                max-width: 420px;
                margin: 0 auto;
            }
            h1 {
                font-size: 1.4rem;
                margin: 0 0 8px;
            }
            p {
                color: var(--muted);
                line-height: 1.4;
            }
            form {
                display: flex;
                gap: 8px;
                margin: 20px 0;
            }
            input {
                flex: 1;
                min-width: 0;
                font-size: 1.6rem;
                letter-spacing: 0.4em;
                text-align: center;
                padding: 10px;
                border: 1px solid var(--border);
                border-radius: 8px;
                background: transparent;
                color: var(--text);
            }
            button {
                font-size: 1.1rem;
                padding: 10px 20px;
                border: 0;
                border-radius: 8px;
                background: var(--accent);
                color: #ffffff;
            }
            button:disabled {
                opacity: 0.5;
            }
            #status {
                font-size: 1.05rem;
                color: var(--text);
            }
            #status.error {
                color: var(--error);
            }
        </style>
    </head>
    <body>
        <main>
            <h1>Join the Arg2P federation</h1>
            <p>Type the code the editor shows next to its name: this phone then solves with it, on its Web Workers, while this page stays open.</p>
            <form id="join">
                <input id="code" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="one-time-code" placeholder="0000" aria-label="Code" required />
                <button id="link" type="submit" disabled>Join</button>
            </form>
            <p id="status" role="status">Loading the solver...</p>
        </main>
        <script type="module">
            // The phone as a site of the federation of the editor serving this page: a WebWorkerSolver of
            // @tuprolog/arg2p (the version of the editor, which a site checks) on Web Workers (worker.js, served next to
            // this page), federated with the editor over the WebSocket of the port of this page
            const MODULE = '{{module}}';
            const form = document.getElementById('join');
            const input = document.getElementById('code');
            const button = document.getElementById('link');
            const status = document.getElementById('status');
            const tell = (text, error = false) => {
                status.textContent = text;
                status.className = error ? 'error' : '';
            };

            // One Web Worker less than the processors, at most 4, to lend: a phone has little memory to spare
            const threads = Math.max(1, Math.min(4, (navigator.hardwareConcurrency ?? 2) - 1));
            const editor = `${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}`;
            let parallel = null;
            let federation = null;

            // What the phone lends, once linked: the sites it is federated with
            const linked = () => (federation === null ? [] : [...federation.stats.sites].slice(1));
            const shown = () => {
                const sites = linked();
                if (sites.length > 0) tell(`Connected: lending ${threads} worker${threads === 1 ? '' : 's'} to ${sites.length} site${sites.length === 1 ? '' : 's'}. Keep this page open.`);
                else if (federation !== null) tell('Disconnected from the editor: type its code again to join.', true);
            };

            let arg2p;
            try {
                arg2p = await import(MODULE);
                // (with no memory to share, as on a page not over HTTPS, its Web Workers cannot wait for the others)
                if (self.crossOriginIsolated) {
                    button.disabled = false;
                    tell('Type the code of the editor.');
                } else {
                    tell('This page cannot lend its workers: open the link the editor shows, over HTTPS.', true);
                }
            } catch (error) {
                tell(`The solver could not be loaded (${MODULE}): ${error.message ?? error}`, true);
            }

            form.addEventListener('submit', async event => {
                event.preventDefault();
                const code = input.value.trim();
                if (!/^[0-9]{4}$/.test(code)) return tell('The code is 4 digits.', true);
                button.disabled = true;
                tell('Joining...');
                parallel?.close();
                // (one more than those it lends: the solver of this site)
                parallel = new arg2p.WebWorkerSolver(threads + 1, new URL('worker.js', location.href).href);
                federation = new arg2p.Federation(parallel);
                try {
                    await federation.connect(editor, code);
                    federation.onPeersChanged = shown;
                    shown();
                } catch (error) {
                    parallel.close();
                    parallel = null;
                    federation = null;
                    tell(`Not linked: ${error.message ?? error}. Check the code (after a few wrong ones, wait a while before trying again).`, true);
                } finally {
                    button.disabled = false;
                }
            });
        </script>
    </body>
</html>
