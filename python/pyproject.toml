[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arg2p"
version = "0.18.2"
description = "Arg2P, structured argumentation in Prolog: the library of the JVM, from Python"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["JPype1>=1.5"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
arg2p = "arg2p.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
arg2p = ["jars/*.jar", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# the JVM handles access violations of its own (on Windows), which the fault handler of pytest would report
addopts = "-p no:faulthandler"
