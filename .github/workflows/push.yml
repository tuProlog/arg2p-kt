name: CI/CD
on:
  # every push runs, whatever it changes: a push the paths left out would report no check at all (a merge changing no
  # file, say), and its pull request would wait for one forever; what a push tests is told by the changes job
  push:
  pull_request:
  workflow_dispatch:

# Read alone, unless a job says otherwise: those releasing and publishing
permissions:
  contents: read

# One run of a branch at a time: a push cancels the run of the push before it, but on master, whose runs release (a run
# waits for the one before it instead)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  # The JDK the builds run on, that of the daemon of Gradle (gradle/gradle-daemon-jvm.properties)
  # renovate: datasource=java-version depName=java-jdk
  JAVA_VERSION: 25.0.5+8.0.LTS

jobs:
  dispatcher:
    # A pull request runs from a fork alone: the push of a branch of this repository runs already
    runs-on: ubuntu-26.04
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - run: 'true'
  ci-cd:
    needs:
      - dispatcher
    # those of the release, the one job of release.yml granted them (the others read alone)
    permissions:
      contents: write
      id-token: write  # Required for OIDC (trusted publishing) on npmjs, in both caller and called workflows
    uses: ./.github/workflows/release.yml
    secrets: inherit
  docs:
    # The documentation site, from master once CI/CD is through: of the release it made, tagged by then, or else of the
    # commit pushed (of the documentation alone, say), stating the latest release
    needs:
      - ci-cd
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/doc.yml
    with:
      version: ${{ needs.ci-cd.outputs.version }}
  python-wheels:
    # The Python package of the release: a wheel for each platform, bundling its Java runtime, and one for any other
    # (on the Java of the system)
    needs:
      - ci-cd
    if: needs.ci-cd.outputs.version != ''
    strategy:
      fail-fast: true
      # the platforms of the release: the runner building for each, and its name for Python and for VS Code
      matrix: &platforms
        include:
          - { os: ubuntu-26.04, python: manylinux2014_x86_64, vscode: linux-x64 }
          - { os: ubuntu-24.04-arm, python: manylinux2014_aarch64, vscode: linux-arm64 }
          - { os: windows-latest, python: win_amd64, vscode: win32-x64 }
          - { os: macos-latest, python: macosx_11_0_arm64, vscode: darwin-arm64 }
          - { os: macos-15-intel, python: macosx_10_15_x86_64, vscode: darwin-x64 }
          - { os: ubuntu-26.04, python: any, vscode: universal }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Checkout the release
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.ci-cd.outputs.version }}
          # the tags: the version of the build is that of the release
          fetch-depth: 0
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
      - uses: actions/setup-python@v7.1.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - name: Build the wheel
        shell: bash
        run: |
          set -euo pipefail
          tasks=":python:pythonJars :python:pythonVersion"
          if [ "${{ matrix.python }}" != any ]; then tasks="$tasks :python:pythonRuntime"; fi
          ./gradlew $tasks
          grep -q "\"${{ needs.ci-cd.outputs.version }}\"" python/src/arg2p/_version.py
          python -m pip install build wheel
          python -m build --wheel --outdir dist python
          if [ "${{ matrix.python }}" != any ]; then
            python -m wheel tags --python-tag py3 --abi-tag none --platform-tag "${{ matrix.python }}" --remove dist/*.whl
          fi
      - name: Check the wheel
        shell: bash
        run: |
          python -m pip install --only-binary=jpype1 dist/*.whl
          cd "$RUNNER_TEMP" && python -c "from arg2p import Arg2p; assert Arg2p.of('f1 :=> a.').answer('a').in_statements == ['a']"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: wheel-${{ matrix.python }}
          path: dist/*.whl
  python-publish:
    # The wheels of the release on PyPI, through trusted publishing (OIDC, no token): from this workflow, as PyPI does
    # not trust a reusable one; once every wheel is built, whatever the packages of VS Code do
    needs:
      - python-wheels
    runs-on: ubuntu-26.04
    environment: release_env
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          # a run again (of a job that failed) publishes what PyPI lacks
          skip-existing: true
  vscode-packages:
    # The extension of VS Code of the release: a package for each platform, bundling its Java runtime, and one for any
    # other (on the Java of the system), attached to the release as well
    needs:
      - ci-cd
    if: needs.ci-cd.outputs.version != ''
    strategy:
      fail-fast: true
      matrix: *platforms
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - name: Checkout the release
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.ci-cd.outputs.version }}
          # the tags: the version of the build is that of the release
          fetch-depth: 0
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: package.json
          cache: npm
          cache-dependency-path: vscode/package-lock.json
      - name: Build the package
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.vscode }}" = universal ]; then
            ./gradlew :vscode:vscodePackage
          else
            ./gradlew :vscode:vscodePackage -Ptarget=${{ matrix.vscode }}
            test -d vscode/runtime/bin
          fi
          ls vscode/*.vsix
          grep -q "${{ needs.ci-cd.outputs.version }}" <<< "$(ls vscode/*.vsix)"
      - name: Attach the package to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.ci-cd.outputs.version }}" vscode/*.vsix --clobber --repo "${{ github.repository }}"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: vsix-${{ matrix.vscode }}
          path: vscode/*.vsix
  vscode-publish:
    # The packages of the extension of VS Code on the Visual Studio Marketplace, through trusted publishing (OIDC, no
    # token): from this workflow, as the wheels; once every package is built, whatever the wheels do. vsce is the one of
    # the extension (vscode/package.json), which Renovate updates.
    needs:
      - ci-cd
      - vscode-packages
    runs-on: ubuntu-26.04
    environment: release_env
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout the release
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.ci-cd.outputs.version }}
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: vsix-*
          merge-multiple: true
          path: dist
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: package.json
          cache: npm
          cache-dependency-path: vscode/package-lock.json
      - name: Publish the packages
        working-directory: vscode
        run: |
          npm ci
          # a run again (of a job that failed) publishes what the Marketplace lacks
          npx vsce publish --oidc --skip-duplicate --packagePath ../dist/*.vsix
  mcp-registry:
    # The MCP server of the release in the MCP Registry, as the package of PyPI running it (uvx arg2p mcp): server.json of
    # the release, published through GitHub OIDC (the namespace io.github.tuProlog, no token), once PyPI has the wheels
    needs:
      - ci-cd
      - python-publish
    runs-on: ubuntu-26.04
    permissions:
      id-token: write
      contents: read
    env:
      # renovate: datasource=github-releases depName=modelcontextprotocol/registry
      MCP_PUBLISHER_VERSION: v1.8.6
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.ci-cd.outputs.version }}
      - uses: sigstore/cosign-installer@v4.1.2
      - name: Install the publisher of the MCP Registry, verified
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl -fsSL -o "$archive" "$base/$archive"
          curl -fsSL -o "$archive.sigstore.json" "$base/$archive.sigstore.json"
          cosign verify-blob --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" "$archive"
          tar xzf "$archive" mcp-publisher
      - name: Publish the server
        run: |
          ./mcp-publisher validate
          ./mcp-publisher login github-oidc
          # the registry reads the package from PyPI, which may not show it at once
          for attempt in 1 2 3 4 5; do
            ./mcp-publisher publish && exit 0
            sleep 60
          done
          exit 1
