name: CI/CD Process
on:
  workflow_call:
    outputs:
      version:
        description: The version released, empty if nothing was (its wheels are the artifacts wheel-*)
        value: ${{ jobs.release.outputs.version }}
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: DanySK/action-checkout@0.2.31
      - name: Check style (ktlint)
        uses: DanySK/build-check-deploy-gradle-action@4.0.49
        with:
          retries-on-failure: '2'
          build-command: true
          check-command: ./gradlew ktlintCheck --parallel --continue
          should-run-codecov: false
  test:
    # Renovate merges on master were already tested on their (up-to-date) PR branch
    if: github.ref_name != 'master' || github.event.commits[0].author.name != 'renovate[bot]'
    uses: ./.github/workflows/test.yml
  release:
    # Run even when tests were skipped (see above), but never after a failure
    if: always() && !cancelled() && !contains(needs.*.result, 'failure')
    environment: release_env
    permissions:
      contents: write
      packages: write
      id-token: write  # Required for OIDC (trusted publishing) on npmjs
    needs:
      - lint
      - test
    runs-on: ubuntu-26.04
    outputs:
      # the version released, empty if nothing was
      version: ${{ steps.released.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          token: ${{ secrets.CI_TOKEN }}
          # Full history: the back-merge step below needs a real merge base.
          fetch-depth: 0
      - name: Install Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: package.json
      - uses: DanySK/build-check-deploy-gradle-action@4.0.49
        with:
          retries-on-failure: '1'
          build-command: true
          check-command: true
          # No npm-token: publication on npmjs relies on trusted publishing (OIDC)
          deploy-command: |
            npm install
            npx semantic-release
          should-run-codecov: false
          should-deploy: true
          github-token: ${{ github.token }}
          maven-central-username: ${{ secrets.MAVEN_USERNAME }}
          maven-central-password: ${{ secrets.MAVEN_PASSWORD }}
          signing-key: ${{ secrets.SIGNING_KEY }}
          signing-password: ${{ secrets.SIGNING_PASSWORD }}
          java-version: '25'
      - name: The version released
        id: released
        run: |
          if [ -f .released-version ]; then echo "version=$(cat .released-version)" >> "$GITHUB_OUTPUT"; fi
      - name: Back-merge the release into develop
        if: github.ref_name == 'master'
        # A back-merge problem must never fail an otherwise successful release.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.CI_TOKEN }}
        run: |
          set -euo pipefail
          # .released-version is written by semantic-release's successCmd, so it
          # exists only when a release was actually published. Checked here in
          # the shell rather than in an `if:` expression, because hashFiles() is
          # not reliable in that position and an invalid expression makes the
          # whole reusable workflow unloadable.
          if [ ! -f .released-version ]; then
            echo "::notice::nothing was released, so there is nothing to back-merge"
            exit 0
          fi
          version="$(cat .released-version)"
          branch="sync/master-to-develop-${version}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --tags origin develop master
          git switch -C "$branch" origin/develop
          if git merge-base --is-ancestor origin/master HEAD; then
            echo "::notice::develop already contains master, nothing to back-merge"
            exit 0
          fi
          # --no-ff guarantees a commit that is not tagged [skip ci]. The release
          # commit itself is, so on its own it would never produce the checks
          # develop requires and the PR could never auto-merge.
          git merge --no-ff origin/master -m "chore: merge master into develop after ${version}"
          git push --force origin "$branch"
          gh pr create --base develop --head "$branch" \
            --title "chore: back-merge release ${version} into develop" \
            --body "Automated back-merge of the ${version} release commit from master into develop. Auto-merge is enabled; this lands as soon as the required checks pass." \
            || echo "::notice::a PR already exists for ${branch}"
          gh pr merge "$branch" --auto --merge
  python-wheels:
    # The Python package of the release: a wheel for each platform, bundling its Java runtime, and one for any other
    # (on the Java of the system)
    needs:
      - release
    if: needs.release.outputs.version != ''
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-latest, platform: manylinux2014_x86_64 }
          - { os: ubuntu-24.04-arm, platform: manylinux2014_aarch64 }
          - { os: windows-latest, platform: win_amd64 }
          - { os: macos-latest, platform: macosx_11_0_arm64 }
          - { os: macos-15-intel, platform: macosx_10_15_x86_64 }
          - { os: ubuntu-latest, platform: any }
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout the release
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.release.outputs.version }}
          # the tags: the version of the build is that of the release
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Build the wheel
        shell: bash
        run: |
          set -euo pipefail
          tasks=":python:pythonJars :python:pythonVersion"
          if [ "${{ matrix.platform }}" != any ]; then tasks="$tasks :python:pythonRuntime"; fi
          ./gradlew $tasks
          grep -q "\"${{ needs.release.outputs.version }}\"" python/src/arg2p/_version.py
          python -m pip install build wheel
          python -m build --wheel --outdir dist python
          if [ "${{ matrix.platform }}" != any ]; then
            python -m wheel tags --python-tag py3 --abi-tag none --platform-tag "${{ matrix.platform }}" --remove dist/*.whl
          fi
      - name: Check the wheel
        shell: bash
        run: |
          python -m pip install --only-binary=jpype1 dist/*.whl
          cd "$RUNNER_TEMP" && python -c "from arg2p import Arg2p; assert Arg2p.of('f1 :=> a.').answer('a').in_statements == ['a']"
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.platform }}
          path: dist/*.whl
  vscode-packages:
    # The extension of VS Code of the release: a package for each platform, bundling its Java runtime, and one for any
    # other (on the Java of the system)
    needs:
      - release
    if: needs.release.outputs.version != ''
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-latest, target: linux-x64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
          - { os: windows-latest, target: win32-x64 }
          - { os: macos-latest, target: darwin-arm64 }
          - { os: macos-15-intel, target: darwin-x64 }
          - { os: ubuntu-latest, target: universal }
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout the release
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.release.outputs.version }}
          # the tags: the version of the build is that of the release
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Build the package
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.target }}" = universal ]; then
            ./gradlew :vscode:vscodePackage
          else
            ./gradlew :vscode:vscodeRuntime
            ./gradlew :vscode:vscodePackage -Ptarget=${{ matrix.target }}
            test -d vscode/runtime/bin
          fi
          ls vscode/*.vsix
          grep -q "${{ needs.release.outputs.version }}" <<< "$(ls vscode/*.vsix)"
      - uses: actions/upload-artifact@v7
        with:
          name: vsix-${{ matrix.target }}
          path: vscode/*.vsix
  success:
    runs-on: ubuntu-26.04
    needs:
      - lint
      - test
      - release
      - python-wheels
      - vscode-packages
    if: >-
      always() && (
        contains(join(needs.*.result, ','), 'failure')
        || !contains(join(needs.*.result, ','), 'cancelled')
      )
    steps:
      - name: Verify that there were no failures
        run: ${{ !contains(join(needs.*.result, ','), 'failure') }}
