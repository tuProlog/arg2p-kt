name: CI/CD Process
on:
  workflow_call:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: DanySK/action-checkout@0.2.31
      - name: Check style (ktlint)
        uses: DanySK/build-check-deploy-gradle-action@4.0.46
        with:
          retries-on-failure: '2'
          build-command: true
          check-command: ./gradlew ktlintCheck --parallel --continue
          should-run-codecov: false
  test:
    # Renovate merges on master were already tested on their (up-to-date) PR branch
    if: github.ref_name != 'master' || github.event.commits[0].author.name != 'renovate[bot]'
    uses: ./.github/workflows/test.yml
  release:
    # Run even when tests were skipped (see above), but never after a failure
    if: always() && !cancelled() && !contains(needs.*.result, 'failure')
    environment: release_env
    permissions:
      contents: write
      packages: write
      id-token: write  # Required for OIDC (trusted publishing) on npmjs
    needs:
      - lint
      - test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          token: ${{ secrets.CI_TOKEN }}
      - name: Install Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: package.json
      - uses: DanySK/build-check-deploy-gradle-action@4.0.46
        with:
          retries-on-failure: '1'
          build-command: true
          check-command: true
          # No npm-token: publication on npmjs relies on trusted publishing (OIDC)
          deploy-command: |
            npm install
            npx semantic-release
          should-run-codecov: false
          should-deploy: true
          github-token: ${{ github.token }}
          maven-central-username: ${{ secrets.MAVEN_USERNAME }}
          maven-central-password: ${{ secrets.MAVEN_PASSWORD }}
          signing-key: ${{ secrets.SIGNING_KEY }}
          signing-password: ${{ secrets.SIGNING_PASSWORD }}
          java-version: '25'
  success:
    runs-on: ubuntu-24.04
    needs:
      - lint
      - test
      - release
    if: >-
      always() && (
        contains(join(needs.*.result, ','), 'failure')
        || !contains(join(needs.*.result, ','), 'cancelled')
      )
    steps:
      - name: Verify that there were no failures
        run: ${{ !contains(join(needs.*.result, ','), 'failure') }}
