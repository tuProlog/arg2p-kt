name: Test
on:
  workflow_call:
  workflow_dispatch:

jobs:
  test-jvm:
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, macos-latest, ubuntu-latest ]
        java-version: [21]
        jdk-dist:
          - oracle
          - temurin
    runs-on: ${{ matrix.os }}
    concurrency:
      group: build-${{ github.workflow }}-${{ matrix.os }}-${{ matrix.java-version }}-${{ matrix.jdk-dist }}-${{ github.event.number || github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: DanySK/action-checkout@0.2.31
      - uses: DanySK/build-check-deploy-gradle-action@4.0.50
        with:
          java-distribution: ${{ matrix.jdk-dist }}
          java-version: ${{ matrix.java-version }}
          build-command: |
            ./gradlew jsMainClasses jsTestClasses --parallel || ./gradlew jsMainClasses jsTestClasses --parallel
          check-command: |
            ./gradlew jvmTest :lsp:test -PtestJvm=${{ matrix.java-version }} --parallel --continue || ./gradlew jvmTest :lsp:test -PtestJvm=${{ matrix.java-version }} --parallel --continue
          should-run-codecov: false

  test-js:
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, macos-latest, ubuntu-latest ]
        node-version:
          - 'latest-22'
          - 'latest-24'
    runs-on: ${{ matrix.os }}
    env:
      ORG_GRADLE_PROJECT_nodeVersion: ${{ matrix.node-version }}
    concurrency:
      group: build-${{ github.workflow }}-${{ matrix.os }}-${{ matrix.node-version }}-${{ github.event.number || github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: DanySK/action-checkout@0.2.31
      - uses: DanySK/build-check-deploy-gradle-action@4.0.50
        with:
          build-command: |
            ./gradlew jsMainClasses jsTestClasses --parallel || ./gradlew jsMainClasses jsTestClasses --parallel
          check-command: |
            ./gradlew jsTest --parallel --continue || ./gradlew jsTest --parallel --continue
          clean-command: ./gradlew cleanTest
          should-run-codecov: false

  test-python:
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, macos-latest, ubuntu-latest ]
    runs-on: ${{ matrix.os }}
    concurrency:
      group: build-${{ github.workflow }}-python-${{ matrix.os }}-${{ github.event.number || github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: DanySK/action-checkout@0.2.31
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
      - uses: DanySK/build-check-deploy-gradle-action@4.0.50
        with:
          # the package as a wheel bundles it: its jars, its version, its Java runtime
          build-command: ./gradlew :python:pythonJars :python:pythonVersion :python:pythonRuntime
          # JPype from its wheels alone: a Python it has none for yet fails here (as an update Renovate proposes
          # would), rather than building it from its sources, which users would have to do as well
          check-command: |
            python -m pip install --only-binary=jpype1 "./python[test]" && python -m pytest python/tests
          should-run-codecov: false

  test-vscode:
    runs-on: ubuntu-latest
    concurrency:
      group: build-${{ github.workflow }}-vscode-${{ github.event.number || github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: DanySK/action-checkout@0.2.31
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: package.json
      - uses: DanySK/build-check-deploy-gradle-action@4.0.50
        with:
          # the extension carries the language server: its tests run it, through JSON-RPC, and the extension in VS Code
          # (on the display of xvfb), as vscodeTest does; the package for any platform fails here rather than once released
          build-command: ./gradlew :vscode:vscodeServer
          check-command: |
            xvfb-run -a ./gradlew :vscode:vscodeTest :vscode:vscodePackage
          should-run-codecov: false
