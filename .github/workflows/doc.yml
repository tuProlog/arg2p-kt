name: Deploy Wiki
on:
  push:
    branches:
      - master
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: 'temurin'
          java-version: '25.0.5+8.0.LTS'
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6.0.0
      - name: Build the site
        run: |
          ./gradlew -PbaseUrl="${{ steps.pages.outputs.base_url }}/" hugoBuild
      - name: The coverage of the tests, published with the site (and read by the badges of the README)
        run: |
          ./gradlew -Pcoverage koverBadge koverHtmlReport :core:jvmPrologCoverage
          mkdir -p doc/build/hugo/publish/coverage
          cp -r build/reports/kover/html doc/build/hugo/publish/coverage/kotlin
          cp build/reports/kover/badge.json doc/build/hugo/publish/coverage/kotlin.json
          cp core/build/reports/prolog-coverage/coverage.md doc/build/hugo/publish/coverage/prolog.md
          cp core/build/reports/prolog-coverage/badge.json doc/build/hugo/publish/coverage/prolog.json
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: ./doc/build/hugo/publish
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1